name: Publish
on:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in step with the Flutter the plugin is actually developed and
          # tested against — publishing from a much older SDK means `analyze`
          # here never sees what integrators see.
          flutter-version: '3.32.4'
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      # - name: Run tests
      #   run: flutter test
      - name: Check formatting
        # Verify rather than rewrite: this runs on the tagged commit, so
        # reformatting here would publish something other than what was tagged.
        # (`dart format --fix` was removed in Dart 3; `dart fix --apply` is the
        # equivalent, and does not belong in a publish job either.)
        run: dart format --output=none --set-exit-if-changed .
      - name: Check Publish Warnings
        run: dart pub publish --dry-run
      - name: Publish
        uses: k-paxian/dart-package-publisher@v1.5.1
        with:
          credentialJson: ${{ secrets.CREDENTIAL_JSON }}
          flutter: true
          skipTests: true